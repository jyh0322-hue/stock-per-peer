<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>(주)브이티(018290) PER·PEER 분석 리포트 · 2026-08-14 18:31:50</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --fg:#111827; --muted:#6b7280; --line:#e5e7eb;
  --brand:#1d4ed8; --brand-soft:#eaf0ff; --target:#e11d48; --target-soft:#fff1f4;
  --good:#059669; --warn:#d97706; --head:#f8fafc; --chip:#5b8cff;
  --shadow:0 1px 3px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1017;--panel:#151a22;--fg:#e6e9ef;--muted:#9aa3b2;--line:#252b36;
    --brand:#5b8cff;--brand-soft:#1a2440;--target:#fb7185;--target-soft:#2a1720;
    --good:#34d399;--warn:#fbbf24;--head:#1b212b;--chip:#3b6ae0;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;line-height:1.55}
.page{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
.hidden{display:none !important}

/* 검색 */
.brand-row{display:flex;align-items:baseline;gap:10px}
h1{font-size:1.55rem;margin:0}
.sub{color:var(--muted);font-size:.9rem;margin:6px 0 22px}
.searchbar{display:flex;gap:10px;max-width:620px}
.searchbar input{flex:1;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;
  font-size:1rem;background:var(--panel);color:var(--fg)}
.searchbar input:focus{outline:none;border-color:var(--brand)}
.btn{padding:13px 22px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.examples{margin-top:14px;color:var(--muted);font-size:.85rem}
.tagpill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 12px;margin:0 6px 6px 0;font-size:.82rem;cursor:pointer;background:var(--panel);color:var(--fg)}
.tagpill:hover{border-color:var(--brand);color:var(--brand)}

.error{background:var(--target-soft);color:var(--target);border:1px solid var(--target);border-radius:12px;
  padding:12px 16px;margin:14px 0;font-size:.9rem;max-width:620px}

/* 진행 */
.prog-wrap{max-width:620px}
.bar{height:10px;background:var(--line);border-radius:8px;overflow:hidden}
.fill{height:100%;width:0%;background:linear-gradient(90deg,var(--brand),var(--chip));border-radius:8px;transition:width .3s}
.steps{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:10px}
.steps li{display:flex;align-items:center;gap:11px;font-size:.92rem;color:var(--muted)}
.steps li .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;flex:none;
  border:1.5px solid var(--line);background:var(--panel)}
.steps li.done{color:var(--fg)} .steps li.done .ic{background:var(--good);border-color:var(--good);color:#fff}
.steps li.now{color:var(--fg);font-weight:600} .steps li.now .ic{border-color:var(--brand);color:var(--brand)}
.spin{width:12px;height:12px;border:2px solid var(--brand);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.prog-caption{margin-top:16px;font-size:.86rem;color:var(--muted)}
.prog-caption b{color:var(--fg)}

/* 결과 */
.result-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.result-head h1{font-size:1.5rem}
.code{color:var(--muted);font-size:1rem}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0 8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.kpi .lab{font-size:.78rem;color:var(--muted)}
.kpi .val{font-size:1.5rem;font-weight:800;margin-top:4px;letter-spacing:-.01em}
.kpi .val small{font-size:.9rem;font-weight:600;color:var(--muted)}
.kpi.hl{background:var(--target-soft);border-color:var(--target)}
.kpi.hl .val{color:var(--target)}
.kpi .note{font-size:.8rem;margin-top:4px}
.note.good{color:var(--good)} .note.warn{color:var(--warn)} .note.muted{color:var(--muted)}

h2{font-size:1.08rem;margin:34px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--brand);display:inline-block}
h2 .hint{font-size:.8rem;color:var(--muted);font-weight:500}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 4px}

.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
th{background:var(--head);color:var(--muted);font-size:.78rem;font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.target td{background:var(--target-soft);font-weight:700}
tr.target td:first-child::before{content:"★ ";color:var(--target)}
.badge-under{color:var(--good);font-weight:700}
.badge-over{color:var(--warn);font-weight:700}

img.chart{width:100%;display:block;border-radius:10px}
.chart-card{padding:14px}

.disc{list-style:none;padding:0;margin:6px 0 0}
.disc li{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line);font-size:.9rem}
.disc li:last-child{border-bottom:0}
.disc .d{color:var(--muted);font-variant-numeric:tabular-nums;width:78px;flex:none}
.disc .t{flex:1}
.disc .type{font-size:.72rem;color:#fff;border-radius:6px;padding:2px 8px;flex:none}
.type.reg{background:#64748b}.type.major{background:#d97706}.type.issue{background:#7c3aed}.type.etc{background:#94a3b8}

/* 투자포인트·리스크 */
.ins-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ins-card{padding:16px 18px;border-left:4px solid var(--line)}
.ins-card.ins-good{border-left-color:var(--good)}
.ins-card.ins-warn{border-left-color:var(--warn)}
.ins-card ul{margin:0;padding-left:18px;font-size:.9rem}
.ins-card li{margin:4px 0}
.ins-title{font-weight:700;margin-bottom:8px}
.ins-title.good{color:var(--good)}
.ins-title.warn{color:var(--warn)}
.src-ref{color:var(--brand);font-size:.78em}
.src-list{margin-top:12px;padding:12px 16px;font-size:.82rem;color:var(--muted)}
.src-list a{color:var(--brand);word-break:break-all}
.ins-empty{padding:14px 16px;color:var(--muted);font-size:.88rem}

@media (max-width:720px){
  .ins-grid{grid-template-columns:1fr}
}

.disclaimer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem}

@media (max-width:720px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .page{padding:20px 14px 60px}
}

</style>
</head>
<body>
<div class="page">
  <p><a href="index.html">&larr; 전체 리포트 목록</a></p>
  <section id="view-result" class="view">
    <div id="result"></div>
  </section>
  <p class="disclaimer">생성 시각: 2026-08-14 18:31:50 KST · 업종: 기타 화학제품 제조업</p>
</div>
<script>
// 결과(res) 렌더링 — 라이브 앱(web/app.js)과 정적 리포트(scripts/build_site.py가 생성하는
// HTML)가 함께 사용하는 순수 렌더 로직. DOM에 값을 "그려 넣는" 것 외의 상태(폴링, 진행바 등)는
// 다루지 않는다. 라이브 SPA 전용 동작(검색 화면으로 복귀)은 #view-search 존재 여부로
// 감지해서만 덧붙인다 — 정적 리포트에는 그 화면 자체가 없기 때문이다.
const $ = (s) => document.querySelector(s);

const REPRT_LABEL = { Q1: "1분기", HALF: "반기", Q3: "3분기", ANNUAL: "4분기" };

const fmt = (v, dp = 1) => (typeof v === "number" && !Number.isNaN(v)
  ? v.toLocaleString("ko-KR", { minimumFractionDigits: dp, maximumFractionDigits: dp })
  : "-");

// PER(영업이익 기준) 셀: 결측 사유(per_status)에 따라 "적자"와 "데이터 없음"을 구분해서
// 표기한다. per_status가 없는 값(적자 여부를 판단할 근거가 없는 경우)은 항상 "데이터 없음".
function perCell(v, status) {
  if (typeof v === "number" && !Number.isNaN(v)) return fmt(v, 1);
  return status === "loss" ? "N/A(적자)" : "데이터 없음";
}

// KRX PER 컬럼은 영업이익 데이터를 근거로 하지 않으므로(단순 시세 교차검증용) "적자"라고
// 단정할 근거가 없다 — 값이 없으면 항상 "데이터 없음"으로만 표기한다.
function krxPerCell(v) {
  return (typeof v === "number" && !Number.isNaN(v)) ? fmt(v, 1) : "데이터 없음";
}

function basisLabel(row) {
  if (!row || !row.year || !row.reprt_key) return "-";
  const q = REPRT_LABEL[row.reprt_key] || row.reprt_key;
  const suffix = row.fs_div === "OFS" ? "(별도)" : "";
  return row.year + " " + q + suffix;
}

function perBadgeClass(v, median, insufficientPeers) {
  if (insufficientPeers) return "";
  if (typeof v !== "number" || typeof median !== "number") return "";
  if (v < median) return "badge-under";
  if (v > median * 1.3) return "badge-over";
  return "";
}

function perNote(v, median, insufficientPeers) {
  // 비교 가능한(PER이 계산된) peer가 2개 미만이면 "업종 중앙값"은 사실상 타깃 자신과의
  // 비교로 퇴화한다 — 저평가/고평가 판정 대신 데이터 부족을 알린다.
  if (insufficientPeers) {
    return '<div class="note muted">비교 가능한 동종업체 부족</div>';
  }
  if (typeof v !== "number" || typeof median !== "number") {
    return '<div class="note muted">업종 비교 데이터 부족</div>';
  }
  if (v < median) return '<div class="note good">업종 중앙값 ' + fmt(median) + '배 대비 저평가</div>';
  if (v > median) return '<div class="note warn">업종 중앙값 ' + fmt(median) + '배 대비 고평가</div>';
  return '<div class="note muted">업종 중앙값과 동일</div>';
}

function fmtDate(d) {
  if (typeof d === "string" && d.length === 8) {
    return d.slice(0, 4) + "-" + d.slice(4, 6) + "-" + d.slice(6, 8);
  }
  return d || "-";
}

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function insightItem(p) {
  const sup = (p.sources || []).map((s) => "[" + s.n + "]").join("");
  const supHtml = sup ? ' <sup class="src-ref">' + escapeHtml(sup) + "</sup>" : "";
  return "<li>" + escapeHtml(p.text) + supHtml + "</li>";
}

function renderInsights(insights) {
  const heading = '<h2>투자포인트 · 리스크 <span class="hint">최근 1개월 뉴스·블로그 · Claude 요약</span></h2>';
  if (!insights || insights.status !== "ok") {
    const notice = insights && insights.status === "no_data" ? "최근 1개월 자료 없음" : "요약 비활성";
    return (
      heading +
      '<div class="card ins-empty">' + notice +
      " — 관련 최근 1개월 뉴스·블로그가 없거나 요약 기능이 비활성화되어 있습니다.</div>"
    );
  }

  const points = (insights.investment_points || []).map(insightItem).join("");
  const risks = (insights.risks || []).map(insightItem).join("");
  const sources = (insights.sources || []).map((s) =>
    "[" + s.n + "] " + escapeHtml(s.title) + " · <i>" + escapeHtml(s.source) + "</i> · " +
    escapeHtml(s.date) + ' · <a href="' + escapeHtml(s.url || "#") + '" target="_blank" rel="noopener">' +
    escapeHtml(s.url) + "</a>"
  ).join("<br>");

  return (
    heading +
    '<div class="ins-grid">' +
      '<div class="card ins-card ins-good"><div class="ins-title good">📈 투자포인트</div>' +
        '<ul>' + (points || "<li>해당 없음</li>") + "</ul></div>" +
      '<div class="card ins-card ins-warn"><div class="ins-title warn">⚠️ 리스크</div>' +
        '<ul>' + (risks || "<li>해당 없음</li>") + "</ul></div>" +
    "</div>" +
    '<div class="card src-list"><b>출처</b> (최근 1개월)<br>' + (sources || "-") + "</div>"
  );
}

function render(res) {
  const t = res.target;
  const s = res.stats || {};

  const rows = (res.peers || []).map((p) => {
    const cls = p.is_target ? ' class="target"' : "";
    const badge = p.is_target ? "" : perBadgeClass(p.per_op, s.median, s.insufficient_peers);
    return (
      "<tr" + cls + "><td>" + p.name + ' <span class="code">' + (p.stock_code || "") + "</span></td>" +
      '<td class="num">' + fmt(p.market_cap, 0) + "</td>" +
      '<td class="num">' + fmt(p.op_3m, 0) + "</td>" +
      '<td class="num">' + fmt(p.op_annualized, 0) + "</td>" +
      '<td class="num ' + badge + '">' + perCell(p.per_op, p.per_status) + "</td>" +
      '<td class="num">' + krxPerCell(p.krx_per) + "</td>" +
      '<td class="num basis">' + basisLabel(p) + "</td></tr>"
    );
  }).join("");

  const discTypeClass = { "정기공시": "reg", "주요사항": "major", "발행공시": "issue" };
  const disc = (res.disclosures || []).slice(0, 20).map((d) => {
    const cls = discTypeClass[d.type] || "etc";
    return (
      '<li><span class="d">' + fmtDate(d.date) + '</span><span class="t">' + d.title + '</span>' +
      '<span class="type ' + cls + '">' + d.type + "</span></li>"
    );
  }).join("");

  const rankLine = (s.rank && s.total && !s.insufficient_peers)
    ? (s.rank + "<small> / " + s.total + "</small>") : "-";

  const insights = renderInsights(res.insights);

  $("#result").innerHTML =
    '<div class="result-head"><h1>' + t.name + '</h1><span class="code">(' + (t.stock_code || "") + ")</span></div>" +
    '<div class="kpis">' +
      '<div class="kpi"><div class="lab">시가총액</div><div class="val">' + fmt(t.market_cap, 0) + '<small> 억</small></div></div>' +
      '<div class="kpi"><div class="lab">최근 분기 영업이익</div><div class="val">' + fmt(t.op_3m, 0) + '<small> 억</small></div>' +
        '<div class="note muted">기준 ' + basisLabel(t) + '</div></div>' +
      '<div class="kpi hl"><div class="lab">PER (영업이익 기준·연환산)</div><div class="val">' + perCell(t.per_op, t.per_status) + '<small> 배</small></div>' +
        perNote(t.per_op, s.median, s.insufficient_peers) + '</div>' +
      '<div class="kpi"><div class="lab">업종 내 순위</div><div class="val">' + rankLine + '</div>' +
        '<div class="note muted">' + (s.insufficient_peers ? "비교 가능한 동종업체 부족" : "PER 낮을수록 상위") + '</div></div>' +
    '</div>' +
    '<h2>업종 PEER 비교 <span class="hint">시총 상위 5 + 타깃</span></h2>' +
    '<div class="card table-scroll"><table><thead><tr>' +
      '<th>종목</th><th class="num">시총(억)</th><th class="num">최근분기 영업익(억)</th>' +
      '<th class="num">연환산(억)</th><th class="num">PER(영업이익)</th><th class="num">KRX PER</th>' +
      '<th class="num">기준분기</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<h2>PER 비교 차트</h2>' +
    '<div class="card chart-card"><img class="chart" src="data:image/png;base64,' + res.chart_per_b64 + '"></div>' +
    '<h2>최근 공시 <span class="hint">타깃 · 최근 90일</span></h2>' +
    '<ul class="disc">' + (disc || "<li>최근 공시 없음</li>") + '</ul>' +
    insights +
    '<div class="disclaimer">※ OpenDART·KRX 데이터를 자동 집계한 자료로, 투자자문·매매판단을 제공하지 않습니다.<br>' +
    'PER(영업이익 기준, 연환산) = 시가총액 ÷ (최근 분기 영업이익 × 4). 영업이익 적자 종목은 N/A(적자), ' +
    '실적을 확인하지 못한 경우는 데이터 없음으로 표기됩니다.</div>';

  // 라이브 SPA(web/index.html + app.js)에만 있는 "새로 검색" 버튼 — 정적 리포트에는
  // #view-search 화면 자체가 없으므로(요소가 없으면 showView/clearError 호출이 깨진다),
  // 그 화면이 실제로 존재할 때만 버튼을 덧붙인다.
  if (document.getElementById("view-search")) {
    $("#result").insertAdjacentHTML(
      "beforeend",
      '<div style="margin-top:24px"><button class="btn" id="again" type="button">새로 검색</button></div>'
    );
    document.getElementById("again").addEventListener("click", () => {
      $("#q").value = "";
      clearError();
      showView("search");
      $("#q").focus();
    });
  }
}
